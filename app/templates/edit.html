{% extends "base.html" %}
{% block title %}Edit note{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h5 class="mb-3">Edit note</h5>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-2"><input class="form-control" name="title" value="{{ note.title }}" required maxlength="100"></div>
      <div class="mb-2"><textarea class="form-control" name="content" rows="5" maxlength="5000">{{ note.content }}</textarea></div>
      <button class="btn btn-primary">Save</button>
      <a class="btn btn-link" href="{{ url_for('notes') }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
