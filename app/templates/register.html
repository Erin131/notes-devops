{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 420px;">
  <div class="card-body">
    <h4 class="mb-3">Create account</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Username</label>
        <input class="form-control" name="username" required minlength="3" maxlength="30"></div>
      <div class="mb-3"><label class="form-label">Password (min 8 characters)</label>
        <input class="form-control" type="password" name="password" required minlength="8"></div>
      <button class="btn btn-success w-100">Register</button>
    </form>
    <p class="mt-3 mb-0 text-center">Have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
