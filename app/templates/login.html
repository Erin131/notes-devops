{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 420px;">
  <div class="card-body">
    <h4 class="mb-3">Login</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Username</label>
        <input class="form-control" name="username" required></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0 text-center">No account? <a href="{{ url_for('register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
