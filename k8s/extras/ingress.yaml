# Bonus: Ingress. Needs:  minikube addons enable ingress
# Then add "<minikube ip>  notes.local" to your hosts file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-ingress
  namespace: notes
spec:
  ingressClassName: nginx
  rules:
    - host: notes.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notes-app
                port: {number: 80}
