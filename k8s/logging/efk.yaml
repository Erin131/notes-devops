# Centralised logging on Kubernetes: Fluentd (DaemonSet) -> Elasticsearch -> Kibana.
# Heavy: give minikube at least 4 GB RAM (minikube start --memory 4096).
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels: {app: elasticsearch}
  template:
    metadata:
      labels: {app: elasticsearch}
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports:
            - containerPort: 9200
          resources:
            requests: {memory: 1Gi}
            limits: {memory: 1500Mi}
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
spec:
  selector: {app: elasticsearch}
  ports:
    - port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels: {app: kibana}
  template:
    metadata:
      labels: {app: kibana}
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.13.4
          env:
            - {name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200"}
          ports:
            - containerPort: 5601
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
spec:
  type: NodePort
  selector: {app: kibana}
  ports:
    - port: 5601
      targetPort: 5601
      nodePort: 30601
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: logging
roleRef:
  kind: ClusterRole
  name: fluentd
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
spec:
  selector:
    matchLabels: {app: fluentd}
  template:
    metadata:
      labels: {app: fluentd}
    spec:
      serviceAccountName: fluentd
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, effect: NoSchedule}
      containers:
        - name: fluentd
          # If this tag is ever removed, pick another "elasticsearch8" tag on Docker Hub.
          image: fluent/fluentd-kubernetes-daemonset:v1.16-debian-elasticsearch8-1
          env:
            - {name: FLUENT_ELASTICSEARCH_HOST, value: elasticsearch.logging.svc.cluster.local}
            - {name: FLUENT_ELASTICSEARCH_PORT, value: "9200"}
            - {name: FLUENT_ELASTICSEARCH_SCHEME, value: http}
            - {name: FLUENT_ELASTICSEARCH_SSL_VERIFY, value: "false"}
            - {name: FLUENT_ELASTICSEARCH_USER, value: ""}
            - {name: FLUENT_ELASTICSEARCH_PASSWORD, value: ""}
            - {name: FLUENT_CONTAINER_TAIL_PARSER_TYPE, value: cri}
          resources:
            requests: {cpu: 100m, memory: 200Mi}
            limits: {memory: 400Mi}
          volumeMounts:
            - {name: varlog, mountPath: /var/log}
            - {name: containers, mountPath: /var/lib/docker/containers, readOnly: true}
      volumes:
        - name: varlog
          hostPath: {path: /var/log}
        - name: containers
          hostPath: {path: /var/lib/docker/containers}
